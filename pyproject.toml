[project]
name = "novel-studio"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.4.0",
    "langchain>=1.2.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.6",
    "langchain-text-splitters>=1.1.0",
    "openai>=2.14.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.12.0",
    "sqlalchemy>=2.0.45",
]

[dependency-groups]
dev = [
    # 代码质量工具
    "ruff>=0.14.10",
    "ty>=0.0.14",
    
    # 核心测试框架
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-xdist>=3.8.0",
    "pytest-cov>=6.0.0",           # 新增：代码覆盖率
    "pytest-mock>=3.14.0",         # 新增：Mock 工具
    "pytest-bdd>=8.0.0",           # 新增：BDD 测试
    
    # 断言与快照工具
    "dirty-equals>=0.11",
    "inline-snapshot>=0.31.1",
    
    # 工具库
    "aiofiles>=25.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
fix = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (基础错误)
    "I",   # isort (自动排序 import)
    "B",   # flake8-bugbear (设计漏洞)
    "UP",  # pyupgrade (Python 3.12 语法升级)
    "N",   # pep8-naming (变量名规范)
    "RUF", # Ruff 特有规则
    "PT",  # flake8-pytest-style (专门针对 pytest 的最佳实践)
    "ASYNC", # flake8-async (异步代码检查)
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.pytest-style]
fixture-parentheses-fp = true
mark-parentheses-fp = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

# 测试选项（包含覆盖率）
addopts = [
    "-ra",                          # 显示所有测试结果摘要
    "-q",                           # 简洁输出
    "--tb=short",                   # 简短的 traceback
    "--strict-markers",             # 强制声明 markers
    "--strict-config",              # 严格配置检查
    "--cov=app",                    # 覆盖率检测 app 目录
    "--cov-report=term-missing",    # 显示未覆盖的行
    "--cov-report=html",            # 生成 HTML 报告
    "--cov-fail-under=70",          # 覆盖率低于 70% 失败
    "-n=auto",                      # 自动并行测试
]

# 自定义测试标记
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "bdd: marks tests as BDD tests",
    "llm: marks tests that call real LLM (expensive)",
]

# BDD 配置
bdd_features_base_dir = "tests/bdd/features"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.analysis]
respect-type-ignore-comments = true

[tool.ty.rules]
# 默认规则配置
unresolved-import = "error"
unresolved-attribute = "error"

[tool.coverage.run]
# 覆盖率运行配置
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
# 覆盖率报告配置
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
